name: Update stock data
on:
  schedule:
    - cron: "17 22 * * 1-5"   # weekdays ~5:17pm New York, after market close
  workflow_dispatch: {}        # lets you run it by hand from the Actions tab
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/fetch.py data.json
      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Update stock data $(date -u +%F)"
          git push
